# 每月 1 號叫醒 Render 上的 Bot，推播上個月的月結排行＆頒獎。
# Bot 端會記錄已推播的月份，重複呼叫不會重複推播。
name: 每月頒獎

on:
  schedule:
    - cron: "0 4 1 * *"   # 台灣時間 1 號 12:00
    - cron: "0 7 1 * *"   # 台灣時間 1 號 15:00（補打一次，以防第一次失敗）
  workflow_dispatch:       # 也可在 GitHub Actions 頁面手動執行

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 叫醒 Bot
        run: curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 https://mahjong-bot-uila.onrender.com/ping
      - name: 觸發月結頒獎
        run: curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 300 -X POST https://mahjong-bot-uila.onrender.com/cron/monthly
